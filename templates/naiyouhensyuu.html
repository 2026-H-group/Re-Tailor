<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出品内容編集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/syuppin.css">
<link rel="stylesheet" href="../static/edit-listing.css">

<link rel="stylesheet" href="../static/common-footer.css">
<script src="../static/common-footer.js" defer></script>
</head>
<body>
  <div class="site">
    <div class="header">
    <div class="header-inner">
        <a class="back-btn" href="syuppin_itiran.html" title="戻る">←</a>
        <a href="top-index.html" class="header-title">Re:Tailor</a>
        <button class="save-btn" type="button">保存</button>
    </div>
</div>
<div class="page">

    <h1 class="page-title">出品内容編集</h1>

    <div class="content">
        <!-- 商品画像や入力欄 -->

    <div class="page">
      <div class="content">
        <div class="field">
          <div class="field-label">商品画像</div>
          <div class="images">
            <div class="img-box empty"></div>
            <div class="img-box empty"></div>
            <div class="img-box empty"></div>
            <div class="add-box" title="画像追加">+</div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">商品名</div>
          <input id="editName" type="text" maxlength="20" placeholder="商品名を入力" />
        </div>

        <div class="field">
          <div class="field-label">カテゴリ</div>
          <div class="select-wrap">
            <select id="editCategory">
              <option value="" selected disabled hidden>カテゴリを選択</option>
              <option>トップス</option>
              <option>アウター</option>
              <option>ボトムス</option>
              <option>ワンピース</option>
              <option>シューズ</option>
              <option>バッグ</option>
              <option>アクセサリー</option>
              <option>その他</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="field-label">系統<span class="optional">任意</span></div>
          <div class="select-wrap">
            <select id="editStyle" name="style">
              <option value="">系統を選択</option>
              <option>コンサバ</option>
              <option>トラッド</option>
              <option>きれいめカジュアル</option>
              <option>フェミニン</option>
              <option>アメカジ</option>
              <option>スポカジ</option>
              <option>ストリート</option>
              <option>ベーシック</option>
              <option>ミニマル</option>
              <option>モード</option>
              <option>ガーリー</option>
              <option>エレガンス</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="field-label">価格</div>
          <input id="editPrice" type="text" inputmode="numeric" maxlength="5" placeholder="￥価格を入力" />
        </div>

        <div class="field">
          <div class="field-label">状態記入欄</div>
          <div class="condition-box">
            <div class="radios">
              <label><input type="radio" name="condition" value="new" /> 新品</label>
              <label><input type="radio" name="condition" value="used" /> 中古</label>
            </div>
            <div class="material-row">
              素材：
              <input id="editMaterial" type="text" maxlength="20" placeholder="素材を入力（例：コットン）" />
            </div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">その他詳細</div>
          <textarea id="editDescription" rows="5" maxlength="225" placeholder="汚れや傷の有無"></textarea>
        </div>
      </div>

      <div class="footer">
        <a class="withdraw-link" href="torisage.html">出品を取り下げる</a>
        <button id="editSubmit" class="update-btn" type="button">更新する</button>
      </div>
    </div>
  </div>
<script src="../static/edit-listing.js"></script>
</body>
</html>
