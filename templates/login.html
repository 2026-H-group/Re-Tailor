<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F3F0E9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/login.css">
    <link rel="stylesheet" href="../static/login-page.css">
    <title>ログイン - Re:Tailor</title>
</head>


<body class="login-page">


    <!-- ログイン画面 -->
    <div class="container">

        <div class="box">

            <!-- ロゴ -->
            <h1 class="logo">
                Re:Tailor
            </h1>


            <!-- Welcome -->
            <h2 class="welcome">
                おかえりなさい!
            </h2>

            <p class="description">
               アカウントにログインするため、メールアドレスとパスワードを入力してください。
            </p>


            <!-- ログインフォーム -->
            <form id="loginForm" novalidate>

                <!-- メールアドレス -->
                <div class="input-group">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="メールアドレスを入力してください"
                    >

                </div>


                <!-- パスワード -->
                <div class="input-group">

                    <label
                        for="password"
                        class="password-label"
                    >

                        <span>
                            パスワード
                        </span>

                        <a
                            href="forgot-password.html"
                            class="forgot"
                        >
                            パスワードをお忘れの場合
                        </a>

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="パスワードを入力してください"
                    >

                </div>


                <!-- ログイン状態を保持 -->
                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        ログイン状態を保持する
                    </label>

                </div>


                <!-- ログイン -->
                
                <button type="submit" class="button">ログイン</button>
                <p id="loginError" class="field-error" role="alert"></p>


                <!-- OR -->
                <div class="or">または</div>


                <!-- Google / Apple -->
                <div class="social-login">


                    <!-- Google -->
                    <button
                        type="button"
                        class="social-button"
                    >

                        
                        <img src="../image/google-logo.png">

                        Googleアカウントでサインインする

                    </button>


                    <!-- Apple -->
                    <button
                        type="button"
                        class="social-button"
                    >

                        <img src="../image/apple-logo.jpg">

                        Appleアカウントでサインインする

                    </button>

                </div>


                <!-- 新規登録 -->
                <div class="login">

                    アカウントをお持ちでありませんか？

                    <a href="signup.html">
                        サインアップ
                    </a>

                </div>


            </form>

        </div>

    </div>

    <script src="../static/auth.js"></script>
</body>
</html>
